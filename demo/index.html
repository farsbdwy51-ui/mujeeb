<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>مجيب — مساعد العملاء الذكي</title>
  <meta name="description" content="مجيب: مساعد ذكاء اصطناعي يرد على عملاء متجرك على مدار الساعة — إجابات من بيانات متجرك فقط، مع توضيح المصدر وتحويل لموظف عند الحاجة." />
  <meta name="theme-color" content="#075e54" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
  <script>
    // تطبيق الثيم قبل الرسم عشان مفيش وميض — محفوظ أو تفضيل النظام
    (function () {
      var t = null;
      try { t = localStorage.getItem("mujeeb_theme"); } catch (e) {}
      if (!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="css/style.css?v=3" />
</head>
<body>
  <div class="phone">
    <header>
      <div class="avatar">م</div>
      <div class="hinfo">
        <div class="hname">مجيب <span class="verified">✔</span></div>
        <div class="hstatus">متصل الآن</div>
        <div id="mode"></div>
      </div>
      <button id="theme" title="تبديل الوضع الليلي/النهاري">🌙</button>
      <button id="reset" title="إعادة الديمو من الأول">↺</button>
    </header>

    <main id="chat"></main>

    <div id="chips"></div>

    <div id="inputbar">
      <input id="input" type="text" placeholder="اكتب رسالتك هنا..." autocomplete="off" />
      <button id="send" title="إرسال">➤</button>
    </div>
  </div>

  <script src="js/engine.js?v=3"></script>
  <!-- config.js اختياري: انسخه من config.example.js وحط مفتاح OpenRouter -->
  <script src="config.js?v=3" onerror="window.APP_CONFIG=window.APP_CONFIG||{}"></script>
  <script src="js/llm-adapter.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
